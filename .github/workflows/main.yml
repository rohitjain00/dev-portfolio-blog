name: Build and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JEKYLL_BASEURL: /dev-portfolio-blog
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.0'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/script.js
          node --check assets/js/theme.js

      - name: Check blocked theme patterns
        run: |
          ! grep -R -n -E 'onload=|onchange=|onclick=|<a name=|id="#|font-size: 1 rem|page\.contenttype == project|my_disqus_shortname|url: johndoe|debug: true|media="none"' \
            _layouts _includes assets _sass _config.yml README.md

      - name: Build site
        run: bundle exec jekyll build --baseurl "$JEKYLL_BASEURL"

      - name: Build Docker image
        run: docker compose -f compose.yml build

      - name: Deploy to sample-site
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: sample-site
